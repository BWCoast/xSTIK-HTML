<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>xSTIK · Token Price Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #F5C518;
    --amber: #E8A902;
    --bg: #0a0a0a;
    --card: #161616;
    --border: #222222;
    --border-gold: rgba(245,197,24,0.2);
    --muted: #666666;
    --white: #ffffff;
    --green: #00e87a;
    --red: #ff3b3b;
    --yellow: #f5c518;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(245,197,24,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,197,24,0.018) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 0;
  }

  .page {
    position: relative; z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  /* ── HEADER ── */
  header { text-align: center; margin-bottom: 40px; }

  .brand-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(36px, 7vw, 64px);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(245,197,24,0.5), 0 0 60px rgba(245,197,24,0.2);
    line-height: 1; display: block;
  }
  .brand-divider {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 8px auto;
  }
  .brand-sub {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--muted); display: block;
  }

  /* ── STATUS ── */
  .status-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 24px;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.live {
    background: var(--green);
    box-shadow: 0 0 8px var(--green), 0 0 16px rgba(0,232,122,0.3);
    animation: breathe 2s ease-in-out infinite;
  }
  .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes breathe {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(0.85); }
  }
  #status-label { color: rgba(255,255,255,0.45); }

  /* ── GLOBAL CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .ctrl-group {
    display: flex;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .ctrl-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 16px;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    position: relative;
  }

  .ctrl-btn:not(:last-child)::after {
    content: '';
    position: absolute; right: 0; top: 20%; bottom: 20%;
    width: 1px; background: var(--border);
  }

  .ctrl-btn:hover { color: var(--white); background: rgba(255,255,255,0.04); }

  .ctrl-btn.active {
    background: rgba(245,197,24,0.12);
    color: var(--gold);
  }

  .ctrl-separator {
    width: 1px; height: 34px;
    background: var(--border);
    align-self: center;
  }

  /* ── CARDS ── */
  .token-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }
  @media(max-width:580px){ .token-grid{ grid-template-columns:1fr; } }

  .token-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 22px 22px 18px;
    position: relative; overflow: hidden;
    transition: border-color 0.4s;
  }
  .token-card::after {
    content: '';
    position: absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0; transition: opacity 0.5s;
  }
  .token-card:hover { border-color: var(--border-gold); }
  .token-card:hover::after { opacity: 1; }

  .corner {
    position: absolute; top:0; right:0;
    width:20px; height:20px;
    border-top: 2px solid var(--gold); border-right: 2px solid var(--gold);
    opacity: 0.35;
  }

  @keyframes flashGreen {
    0% { background:rgba(0,232,122,0.08); border-color:rgba(0,232,122,0.3); }
    100% { background:var(--card); border-color:var(--border); }
  }
  @keyframes flashRed {
    0% { background:rgba(255,59,59,0.08); border-color:rgba(255,59,59,0.3); }
    100% { background:var(--card); border-color:var(--border); }
  }
  .token-card.flash-up   { animation: flashGreen 0.8s ease forwards; }
  .token-card.flash-down { animation: flashRed   0.8s ease forwards; }

  /* Card top */
  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 14px;
  }
  .token-symbol {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--gold); letter-spacing: 0.06em;
  }
  .token-name {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-top: 2px;
  }

  /* Trend badge */
  .trend-badge {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 2px;
    border: 1px solid; white-space: nowrap;
  }
  .trend-badge.bullish { color:var(--green); border-color:rgba(0,232,122,0.25); background:rgba(0,232,122,0.07); }
  .trend-badge.bearish { color:var(--red);   border-color:rgba(255,59,59,0.25);  background:rgba(255,59,59,0.07); }
  .trend-badge.neutral { color:var(--yellow);border-color:rgba(245,197,24,0.25); background:rgba(245,197,24,0.07); }
  .trend-badge.loading-b { color:var(--muted); border-color:var(--border); background:transparent; }
  .trend-icon { font-size: 11px; }

  /* Chart */
  .chart-wrap { position: relative; margin-bottom: 14px; height: 80px; }
  .chart-canvas { width: 100%; height: 80px; display: block; }
  .chart-hl { position: absolute; top:0; right:0; bottom:0; left:0; pointer-events:none; }
  .hl-label { position: absolute; right: 4px; font-size: 9px; letter-spacing: 0.08em; font-weight: 600; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; }
  .hl-label.high { color: rgba(0,232,122,0.65); }
  .hl-label.low  { color: rgba(255,59,59,0.65); }

  /* Price */
  .price-main {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--white); min-height: 30px; margin-bottom: 3px;
  }
  .price-main.loading {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-family: 'Rajdhani', sans-serif;
    font-weight: 400; color: var(--muted); letter-spacing: 0.05em;
  }
  .price-secondary {
    font-size: 13px; color: var(--muted); min-height: 17px;
    margin-bottom: 12px; font-weight: 500;
  }

  .ring {
    width:14px; height:14px;
    border: 2px solid var(--border); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink:0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Trend stats */
  .trend-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 2px;
    overflow: hidden; margin-bottom: 12px;
  }
  .stat-cell {
    background: #111111;
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .stat-val { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--white); }
  .stat-val.up   { color: var(--green); }
  .stat-val.down { color: var(--red);   }

  /* Momentum */
  .momentum-wrap { margin-bottom: 14px; }
  .momentum-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .momentum-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .momentum-score { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: var(--white); }
  .momentum-track {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    position: relative;
  }
  .momentum-track::after {
    content: ''; position: absolute; top:0; bottom:0; left:50%; width:1px;
    background: rgba(255,255,255,0.15);
  }
  .momentum-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease, left 0.6s ease, background 0.6s ease; position: absolute; top: 0; }

  /* Card footer */
  .card-footer {
    border-top: 1px solid var(--border); padding-top: 10px;
    display: flex; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .card-footer .val { color: rgba(255,255,255,0.3); font-weight: 600; font-family: monospace; font-size: 9px; }

  /* History loading state */
  .history-loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(22,22,22,0.85);
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); gap: 8px;
  }

  /* Info / footer */
  .info-note {
    background: rgba(245,197,24,0.03); border: 1px solid rgba(245,197,24,0.09);
    border-radius: 3px; padding: 14px 18px;
    font-size: 12px; line-height: 1.8; color: var(--muted);
    text-align: center; letter-spacing: 0.05em; margin-bottom: 20px;
  }
  .info-note strong { color: var(--gold); }

  .refresh-footer {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  .bar-track { width:80px; height:2px; background:var(--border); border-radius:1px; overflow:hidden; }
  .bar-fill { height:100%; background: linear-gradient(90deg, var(--amber), var(--gold)); width:0%; }

  /* ── THEME TOGGLE ── */
  .theme-toggle {
    position: absolute; top: 48px; right: 20px;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer; background: transparent;
    transition: color 0.2s, border-color 0.2s;
    z-index: 10;
  }
  .theme-toggle:hover { color: var(--gold); border-color: var(--gold); }

  /* ── LIGHT MODE ── */
  /* Matches xstik.art main website light theme */
  body.light {
    --bg: #f5f5f0;
    --card: #ffffff;
    --border: #ddd;
    --border-gold: rgba(180,140,0,0.18);
    --muted: #555;
    --white: #1a1a1a;
    --green: #00b85e;
    --red: #d42020;
    --yellow: #c49e00;
    --gold: #d4a800;
    --amber: #b8920a;
  }
  body.light {
    background: var(--bg);
    color: var(--white);
  }
  body.light::before {
    background-image:
      linear-gradient(rgba(180,140,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,140,0,0.04) 1px, transparent 1px);
  }
  body.light::after {
    background: radial-gradient(ellipse at center, transparent 30%, rgba(245,245,240,0.5) 100%);
  }
  body.light .brand-logo {
    text-shadow: 0 0 20px rgba(180,140,0,0.35), 0 0 60px rgba(180,140,0,0.12);
  }
  body.light .brand-divider {
    background: linear-gradient(90deg, transparent, #c49e00, transparent);
  }
  body.light .ctrl-group {
    background: #f0f0ea;
    border-color: #ddd;
  }
  body.light .ctrl-btn:hover { color: var(--white); background: rgba(0,0,0,0.04); }
  body.light .ctrl-btn.active {
    background: rgba(180,140,0,0.12);
    color: var(--gold);
  }
  body.light .ctrl-separator { background: #ddd; }
  body.light .token-card {
    background: var(--card);
    border-color: #e0e0da;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  body.light .token-card:hover { border-color: rgba(180,140,0,0.35); }
  body.light .corner {
    border-top-color: var(--gold); border-right-color: var(--gold);
  }
  body.light .stat-cell { background: #fafaf8; }
  body.light .momentum-track { background: #e0e0da; }
  body.light .momentum-track::after { background: rgba(0,0,0,0.1); }
  body.light .card-footer { border-top-color: #e0e0da; }
  body.light .card-footer .val { color: rgba(0,0,0,0.35); }
  body.light .info-note {
    background: rgba(180,140,0,0.04);
    border-color: rgba(180,140,0,0.12);
  }
  body.light .bar-track { background: #e0e0da; }
  body.light .history-loading { background: rgba(255,255,255,0.85); }
  body.light #status-label { color: rgba(0,0,0,0.4); }
  body.light .price-main.loading { color: var(--muted); }
  body.light .price-secondary { color: #777; }
  @keyframes flashGreenLight {
    0% { background:rgba(0,184,94,0.08); border-color:rgba(0,184,94,0.3); }
    100% { background:#ffffff; border-color:#e0e0da; }
  }
  @keyframes flashRedLight {
    0% { background:rgba(212,32,32,0.08); border-color:rgba(212,32,32,0.3); }
    100% { background:#ffffff; border-color:#e0e0da; }
  }
  body.light .token-card.flash-up   { animation: flashGreenLight 0.8s ease forwards; }
  body.light .token-card.flash-down { animation: flashRedLight   0.8s ease forwards; }
</style>
</head>
<body>
<div class="page">

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light mode" title="Toggle light/dark mode">&#x263C;</button>

  <header>
    <span class="brand-logo">xSTIK</span>
    <div class="brand-divider"></div>
    <span class="brand-sub">Live Token Price &amp; Trend Feed · XRPL DEX</span>
  </header>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-label">Initialising…</span>
  </div>

  <!-- ── GLOBAL CONTROLS ── -->
  <div class="controls">

    <!-- Timeframe — FIX 5: added 7D button; default active is 24H -->
    <div class="ctrl-group" id="tf-group">
      <button class="ctrl-btn" data-tf="15">15M</button>
      <button class="ctrl-btn" data-tf="60">1H</button>
      <button class="ctrl-btn active" data-tf="1440">24H</button>
      <button class="ctrl-btn" data-tf="10080">7D</button>
    </div>

    <div class="ctrl-separator"></div>

    <!-- Currency -->
    <div class="ctrl-group" id="cur-group">
      <button class="ctrl-btn active" data-cur="xrp">XRP</button>
      <button class="ctrl-btn" data-cur="usd">USD</button>
    </div>

  </div>

  <div class="token-grid" id="grid"></div>

  <div class="info-note">
    Prices from the <strong>XRPL DEX</strong> order book · Stored only on price change · USD from stored data · <strong>STABLE</strong> = no movement in this timeframe window
  </div>

  <div class="refresh-footer">
    <span>Next refresh</span>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <span id="countdown">5m</span>
  </div>

</div>

<script src="https://unpkg.com/xrpl@3.0.0/build/xrpl-latest.js"></script>
<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const SUPABASE_URL = 'https://obwxsfezyqexjwngcsaa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9id3hzZmV6eXFleGp3bmdjc2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MTAxOTksImV4cCI6MjA4NzA4NjE5OX0.PujHpJHOYXzfFiGEoi3GoXABg9_DMB8aeKlcefBy6oc';

const TOKENS = [
  { symbol:'xSTIK',  name:'Official XRP Mascot',  currency:'785354494B000000000000000000000000000000', issuer:'rJNV9i4Q6zvRhpE2zjxgkvff3eGHQohZht' },
  { symbol:'xOFOOD', name:'xSTIK Food Token',      currency:'784F464F4F440000000000000000000000000000', issuer:'rQJdoz8sM3qupab9qjnbC6YFYmHreWPpNb' },
];

const WS   = 'wss://xrplcluster.com';
const TICK = 300_000; // 5 minutes — matches collector

// ═══════════════════════════════════════════════
// UI STATE
// ═══════════════════════════════════════════════
// FIX 1/5: default to 24H — most data, renders immediately on load
let activeTf  = 1440;  // minutes: 15 | 60 | 1440 | 10080
let activeCur = 'xrp'; // 'xrp' | 'usd'

// Per-token runtime state
const state = Object.fromEntries(TOKENS.map(t => [t.symbol, {
  history: [],     // [{fetched_at, price_xrp, price_usd}] from Supabase
  livePrice: null, // latest live XRP price (null until XRPL returns)
  liveUsd:   null, // latest live USD price (derived from xrpUsd rate)
}]));

let client = null;
let xrpUsd = 0;  // XRP/USD rate — derived from stored history, no CoinGecko
let cdInt  = null;

// ═══════════════════════════════════════════════
// SUPABASE — fetch history for a given timeframe
// FIX 5: dynamic limit based on timeframe depth
// ═══════════════════════════════════════════════
async function fetchHistory(symbol, minutes) {
  const since = new Date(Date.now() - minutes * 60 * 1000).toISOString();
  // ~1 row per 5 min; add 20% buffer and a floor of 20, cap at 3000
  const limit = Math.min(3000, Math.max(20, Math.ceil((minutes / 5) * 1.2) + 10));
  const url   = `${SUPABASE_URL}/rest/v1/token_prices`
    + `?select=fetched_at,price_xrp,price_usd`
    + `&symbol=eq.${symbol}`
    + `&fetched_at=gte.${since}`
    + `&order=fetched_at.asc`
    + `&limit=${limit}`;

  try {
    const r = await fetch(url, {
      headers: {
        'apikey':        SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
      }
    });
    if (!r.ok) return [];
    return await r.json(); // [{fetched_at, price_xrp, price_usd}]
  } catch { return []; }
}

// ═══════════════════════════════════════════════
// SUPABASE — load history for all tokens
// ═══════════════════════════════════════════════
async function loadAllHistory() {
  for (const token of TOKENS) {
    const rows = await fetchHistory(token.symbol, activeTf);
    state[token.symbol].history = rows;
  }
}

// ═══════════════════════════════════════════════
// XRP/USD RATE — FIX 2: derived from stored price_usd/price_xrp ratio
// No CoinGecko needed — the backend already stores price_usd every 5 min.
// This is called after loadAllHistory() so history is populated.
// ═══════════════════════════════════════════════
function deriveXrpUsdFromHistory() {
  for (const token of TOKENS) {
    const rows = state[token.symbol].history;
    if (!rows.length) continue;
    // Use the most recent row to get the implied rate
    const latest = rows[rows.length - 1];
    const xrp = +latest.price_xrp;
    const usd = +latest.price_usd;
    if (xrp > 0 && usd > 0) {
      xrpUsd = usd / xrp;
      return; // Found a valid rate — done
    }
  }
  // No history yet (first-ever run with empty DB) — xrpUsd stays 0
}

// ═══════════════════════════════════════════════
// XRPL LIVE PRICE
// Uses ASK (sell side) as primary price — matches XPMarket and all DEX feeds.
// book_offers(taker_gets:token, taker_pays:XRP) = sellers asking for XRP = ASK
// book_offers(taker_gets:XRP,   taker_pays:token) = buyers offering XRP = BID
// For illiquid tokens the BID/ASK spread is wide; using BID gives prices
// ~35–700% below the true market price. ASK = what you pay to buy the token.
// ═══════════════════════════════════════════════
async function fetchLivePrice(token) {
  if (!client || !client.isConnected()) return null;

  const tryBook = async (gets, pays) => {
    try {
      const r = await client.request({ command:'book_offers', taker_gets:gets, taker_pays:pays, limit:5 });
      return r.result?.offers ?? [];
    } catch { return []; }
  };

  // PRIMARY: ASK — taker pays XRP, receives token → sellers' lowest ask price
  const A = await tryBook({ currency:token.currency, issuer:token.issuer }, { currency:'XRP' });
  if (A.length) {
    const b    = A[0];
    const tokA = typeof b.TakerGets==='string' ? +b.TakerGets : (+b.TakerGets?.value??0);
    const xrpD = typeof b.TakerPays==='string' ? +b.TakerPays : (+b.TakerPays?.value??0)*1e6;
    if (xrpD > 0 && tokA > 0) return (xrpD/1e6)/tokA;
  }

  // FALLBACK: BID — taker receives XRP, pays token → buyers' best bid price
  // Only reached when there are zero sell offers (extremely rare).
  const B = await tryBook({ currency:'XRP' }, { currency:token.currency, issuer:token.issuer });
  if (B.length) {
    const b    = B[0];
    const xrpD = typeof b.TakerGets==='string' ? +b.TakerGets : (+b.TakerGets?.value??0)*1e6;
    const tokA = typeof b.TakerPays==='string' ? +b.TakerPays : (+b.TakerPays?.value??0);
    if (xrpD > 0 && tokA > 0) return (xrpD/1e6)/tokA;
  }

  return null;
}

// ═══════════════════════════════════════════════
// TREND ENGINE
// Linear regression slope (range-normalised) + recent momentum.
//
// Key change from prior version: slope is now divided by the observed price
// RANGE rather than the mean. This makes the engine sensitive to actual
// relative movement within the timeframe window, regardless of absolute price
// magnitude. A token that moved 0.1% over 7D will score ~59 (RISING) instead
// of ~50 (NEUTRAL). Genuinely flat data (range < 0.1% of mean) is labelled
// STABLE rather than NEUTRAL, communicating illiquid-market state accurately.
// ═══════════════════════════════════════════════
function calcTrend(vals) {
  if (vals.length < 3) return { label:'LOADING', cls:'loading-b', icon:'·', score:50 };

  const n    = vals.length;
  const minV = Math.min(...vals);
  const maxV = Math.max(...vals);
  const range = maxV - minV;

  // STABLE: total price range is less than 0.1% of mean — no meaningful movement
  // in this timeframe window. Return early with a fixed score of 50.
  let sumY = 0; for (let i=0;i<n;i++) sumY += vals[i];
  const mean = sumY / n;
  if (mean > 0 && range / mean < 0.001) {
    return { label:'STABLE', cls:'neutral', icon:'—', score:50 };
  }

  // Linear regression
  let sumX=0,sumXY=0,sumX2=0;
  for (let i=0;i<n;i++) { sumX+=i; sumXY+=i*vals[i]; sumX2+=i*i; }
  const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);

  // Range-normalised slope: how many full-range moves does the trend cover?
  // Falls back to mean-normalised when range is near-zero (prevents div-by-zero).
  const slopeNorm = (range > mean * 0.001 && range > 0)
    ? (slope * n) / range
    : (mean > 0 ? slope / mean : 0);

  let recentMom = 0;
  if (n>=6) {
    const recent = vals.slice(-3).reduce((a,b)=>a+b,0)/3;
    const prior  = vals.slice(-6,-3).reduce((a,b)=>a+b,0)/3;
    recentMom = prior>0 ? (recent-prior)/prior : 0;
  } else if (n>=2) {
    recentMom = vals[0]>0 ? (vals[n-1]-vals[0])/vals[0] : 0;
  }

  // slopeNorm is now dimensionless (0–1 range typical) so clamp is widened to ±1
  const combined = slopeNorm*0.6 + recentMom*0.4;
  const clamped  = Math.max(-1, Math.min(1, combined));
  const score    = Math.round(50 + clamped * 50);

  let label,cls,icon;
  if      (score>=65){label='BULLISH'; cls='bullish';icon='▲';}
  else if (score>=55){label='RISING';  cls='bullish';icon='↗';}
  else if (score>=45){label='NEUTRAL'; cls='neutral';icon='→';}
  else if (score>=35){label='FALLING'; cls='bearish';icon='↘';}
  else               {label='BEARISH'; cls='bearish';icon='▼';}

  return {label,cls,icon,score};
}

// ═══════════════════════════════════════════════
// FORMAT HELPERS
// ═══════════════════════════════════════════════
function fmtXrp(p) {
  if (!p && p!==0) return '—';
  if (p<0.000001)  return p.toExponential(4);
  if (p<0.0001)    return p.toFixed(8);
  if (p<0.01)      return p.toFixed(6);
  if (p<1)         return p.toFixed(5);
  return p.toFixed(4);
}

function fmtUsd(p) {
  if (!p && p!==0) return '—';
  if (p<0.000001)  return '$'+p.toExponential(4);
  if (p<0.0001)    return '$'+p.toFixed(8);
  if (p<0.01)      return '$'+p.toFixed(6);
  if (p<1)         return '$'+p.toFixed(4);
  return '$'+p.toFixed(3);
}

// Show more decimal places for micro-movements so tiny but real changes
// (e.g. +0.1053% over 7D) are readable rather than rounding to +0.00%.
function fmtPct(p) {
  const abs = Math.abs(p);
  const dec = abs < 0.01 ? 4 : 2;
  return (p>=0?'+':'') + p.toFixed(dec) + '%';
}

function tfLabel(tf) {
  if (tf===15)    return '15M';
  if (tf===60)    return '1H';
  if (tf===1440)  return '24H';
  if (tf===10080) return '7D';
  return tf+'M';
}

// ═══════════════════════════════════════════════
// GET DISPLAY VALUES from combined history + live
// FIX 3: guard against null live tick corrupting USD series
// FIX 3: filter zeros (catches +null === 0 coercion)
// ═══════════════════════════════════════════════
function getDisplayValues(symbol) {
  const s    = state[symbol];
  const rows = [...s.history];

  // Append live tick only when the relevant currency value is valid
  if (s.livePrice !== null && s.livePrice > 0) {
    const usdVal = s.liveUsd;
    // In USD mode: skip live tick if we don't have a valid USD value —
    // appending null here would corrupt the series (+null === 0).
    if (activeCur !== 'usd' || (usdVal !== null && usdVal > 0)) {
      rows.push({
        fetched_at: new Date().toISOString(),
        price_xrp:  s.livePrice,
        price_usd:  usdVal,
      });
    }
  }

  return rows
    .map(r => activeCur==='xrp' ? +r.price_xrp : +r.price_usd)
    .filter(v => v > 0); // strip nulls-coerced-to-0 and genuine zeros
}

// ═══════════════════════════════════════════════

          <span class="trend-icon">·</span> LOADING

      </div>

      <div class="chart-wrap" id="chart-wrap-${t.symbol}">
        <canvas class="chart-canvas" id="chart-${t.symbol}"></canvas>
        <div class="chart-hl" id="hl-${t.symbol}"></div>
      </div>

      <div class="price-main loading" id="price-${t.symbol}">
        <span class="ring"></span> Loading…
      </div>
      <div class="price-secondary" id="price2-${t.symbol}">—</div>

      <div class="trend-stats">
        <div class="stat-cell">
          <span class="stat-label" id="pct-label-${t.symbol}">24H %</span>
          <span class="stat-val" id="stat-pct-${t.symbol}">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">High</span>
          <span class="stat-val up" id="stat-high-${t.symbol}">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Low</span>
          <span class="stat-val down" id="stat-low-${t.symbol}">—</span>
        </div>
      </div>

      <div class="momentum-wrap">

// ═══════════════════════════════════════════════
// STATUS
// ═══════════════════════════════════════════════
function setStatus(cls, text) {
  document.getElementById('dot').className = 'dot '+cls;
  document.getElementById('status-label').textContent = text;
}

// ═══════════════════════════════════════════════
// DRAW CHART
// ═══════════════════════════════════════════════
function drawChart(symbol, vals) {
  const canvas = document.getElementById(`chart-${symbol}`);
  const hlWrap = document.getElementById(`hl-${symbol}`);
  if (!canvas || vals.length < 2) { if(hlWrap) hlWrap.innerHTML=''; return; }

  const dpr  = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  const CW   = (rect.width||400)*dpr;
  const CH   = (rect.height||80)*dpr;
  canvas.width=CW; canvas.height=CH;

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w=rect.width||400, h=rect.height||80;
  ctx.clearRect(0,0,w,h);

  // vals is already filtered (no zeros) from getDisplayValues
  const clean = vals;
  if (clean.length<2){ if(hlWrap) hlWrap.innerHTML=''; return; }

  const minV  = Math.min(...clean);
  const maxV  = Math.max(...clean);
  const range = maxV-minV || maxV*0.005 || 1e-9;
  const PT=10, PB=6;

  const xOf = i => (i/(clean.length-1))*w;
  const yOf = v => PT+(1-(v-minV)/range)*(h-PT-PB);

  const isUp = clean[clean.length-1]>=clean[0];
  const col  = isUp ? '#00e87a' : '#ff3b3b';
  const colA = isUp ? 'rgba(0,232,122,' : 'rgba(255,59,59,';

  // Grid lines
  const isLight = document.body.classList.contains('light');
  ctx.strokeStyle= isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)'; ctx.lineWidth=1;
  [0.25,0.5,0.75].forEach(f=>{
    const y=PT+f*(h-PT-PB);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  });

  // Area
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,colA+'0.18)'); grad.addColorStop(1,colA+'0)');
  ctx.beginPath(); ctx.moveTo(xOf(0),h);
  clean.forEach((v,i)=>ctx.lineTo(xOf(i),yOf(v)));
  ctx.lineTo(xOf(clean.length-1),h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();

  // Line
  ctx.beginPath();
  clean.forEach((v,i)=>{
    if(i===0){ctx.moveTo(xOf(i),yOf(v));return;}
    const x0=xOf(i-1),y0=yOf(clean[i-1]),x1=xOf(i),y1=yOf(v);
    ctx.bezierCurveTo((x0+x1)/2,y0,(x0+x1)/2,y1,x1,y1);
  });
  ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.stroke();

  // H/L markers
  let hiI=0,loI=0;
  clean.forEach((v,i)=>{ if(v>clean[hiI])hiI=i; if(v<clean[loI])loI=i; });
  [[hiI,'#00e87a'],[loI,'#ff3b3b']].forEach(([idx,c])=>{
    ctx.setLineDash([2,4]); ctx.strokeStyle=c+'44'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,yOf(clean[idx])); ctx.lineTo(xOf(idx),yOf(clean[idx])); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(xOf(idx),yOf(clean[idx]),3,0,Math.PI*2);
    ctx.fillStyle=c; ctx.fill();
  });

  // Live dot
  const lx=xOf(clean.length-1),ly=yOf(clean[clean.length-1]);
  ctx.shadowColor=col; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(lx,ly,3.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  ctx.shadowBlur=0;

  // H/L overlay labels
  if (hlWrap) {
    const hiPct=(yOf(clean[hiI])/h)*100;
    const loPct=(yOf(clean[loI])/h)*100;
    hlWrap.innerHTML=`
      <span class="hl-label high" style="top:${Math.max(0,hiPct-2)}%">H</span>
      <span class="hl-label low"  style="top:${Math.min(88,loPct-2)}%">L</span>
    `;
  }
}

// ═══════════════════════════════════════════════
// MOMENTUM BAR
// ═══════════════════════════════════════════════
function updateMomentumBar(symbol, trend) {
  const fill  = document.getElementById(`mom-fill-${symbol}`);
  const score = document.getElementById(`mom-score-${symbol}`);
  if (!fill||!score) return;

  const s=trend.score;
  let width,left,bg;
  if (s>=50) {
    width=((s-50)/50)*50; left=50;
    bg=`linear-gradient(90deg,rgba(0,232,122,0.5),#00e87a)`;
  } else {
    width=((50-s)/50)*50; left=50-width;
    bg=`linear-gradient(270deg,rgba(255,59,59,0.5),#ff3b3b)`;
  }
  fill.style.width=width+'%'; fill.style.left=left+'%'; fill.style.background=bg;
  score.textContent=s+'/100';
  score.style.color=s>=55?'#00e87a':s<=45?'#ff3b3b':'#f5c518';
}

// ═══════════════════════════════════════════════
// RENDER CARD — using current activeCur + activeTf
// FIX 1: decoupled from livePrice; falls back to latest history row
// FIX 3: uses filtered vals (no zero corruption)
// ═══════════════════════════════════════════════
function renderCard(token) {
  const s       = state[token.symbol];
  const priceEl = document.getElementById(`price-${token.symbol}`);
  const price2El= document.getElementById(`price2-${token.symbol}`);
  const trendEl = document.getElementById(`trend-${token.symbol}`);

  // ── FIX 1: Determine display prices ──────────────────────────────
  // Prefer live price; fall back to the latest Supabase history row.
  // This ensures history data is always shown — even if XRPL is slow.
  const latestRow  = s.history.length ? s.history[s.history.length - 1] : null;
  const isLive     = s.livePrice !== null && s.livePrice > 0;
  const displayXrp = isLive
    ? s.livePrice
    : (latestRow ? +latestRow.price_xrp : null);
  const displayUsd = (s.liveUsd !== null && s.liveUsd > 0)
    ? s.liveUsd
    : (latestRow ? +latestRow.price_usd : null);
  // ─────────────────────────────────────────────────────────────────

  // Nothing to show at all — DB empty and XRPL not connected yet
  if (displayXrp === null && displayUsd === null) {
    priceEl.className = 'price-main loading';
    priceEl.innerHTML = '<span class="ring"></span> Loading…';
    return;
  }

  // ── Primary price display ──
  priceEl.className = 'price-main';
  if (activeCur==='xrp') {
    priceEl.textContent  = displayXrp !== null ? fmtXrp(displayXrp)+' XRP' : '—';
    price2El.textContent = displayUsd !== null ? fmtUsd(displayUsd) : '—';
  } else {
    priceEl.textContent  = displayUsd !== null ? fmtUsd(displayUsd) : '—';
    price2El.textContent = displayXrp !== null ? fmtXrp(displayXrp)+' XRP' : '—';
  }
  // Subtle "cached" note when showing history while live is still loading
  if (!isLive && latestRow) {
    price2El.textContent += ' · cached';
  }

  // ── Build value series for chart + stats ──
  const vals = getDisplayValues(token.symbol); // already filtered > 0

  // ── Period % change ──
  const pctLabel = document.getElementById(`pct-label-${token.symbol}`);
  const pctEl    = document.getElementById(`stat-pct-${token.symbol}`);
  if (pctLabel) pctLabel.textContent = tfLabel(activeTf)+' %';

  if (vals.length >= 2) {
    const open = vals[0];
    const now  = vals[vals.length-1];
    const pct  = open>0 ? ((now-open)/open)*100 : 0;
    if (pctEl) {
      pctEl.textContent = fmtPct(pct);
      pctEl.className   = `stat-val ${pct>=0?'up':'down'}`;
    }
  } else {
    if (pctEl) { pctEl.textContent='—'; pctEl.className='stat-val'; }
  }

  // ── High / Low ──
  // vals is already clean (> 0 only) — no extra filter needed
  const highEl = document.getElementById(`stat-high-${token.symbol}`);
  const lowEl  = document.getElementById(`stat-low-${token.symbol}`);
  if (vals.length>0) {
    const hi = Math.max(...vals);
    const lo = Math.min(...vals);
    if (highEl) highEl.textContent = activeCur==='xrp' ? fmtXrp(hi) : fmtUsd(hi);
    if (lowEl)  lowEl.textContent  = activeCur==='xrp' ? fmtXrp(lo) : fmtUsd(lo);
  }

  // ── Trend ──
  const trend = calcTrend(vals);
  trendEl.className=`trend-badge ${trend.cls}`;
  trendEl.innerHTML=`<span class="trend-icon">${trend.icon}</span> ${trend.label}`;
  updateMomentumBar(token.symbol, trend);

  // ── Chart ──
  drawChart(token.symbol, vals);
}

// ═══════════════════════════════════════════════
// LIVE FETCH CYCLE
// FIX 2: calls deriveXrpUsdFromHistory() instead of refreshXrpUsd()
// ═══════════════════════════════════════════════
async function fetchAll() {
  setStatus('live',`Fetching… ${new Date().toLocaleTimeString()}`);
  // FIX 2: derive USD rate from stored history — no CoinGecko needed
  deriveXrpUsdFromHistory();

  for (const token of TOKENS) {
    const price = await fetchLivePrice(token);
    const s     = state[token.symbol];
    const prev  = s.livePrice;

    s.livePrice = price;
    s.liveUsd   = (price!==null && price>0 && xrpUsd>0) ? price*xrpUsd : null;

    // Flash on price change
    const card = document.getElementById(`card-${token.symbol}`);
    if (card && prev!==null && price!==null && price>0 && price!==prev) {
      card.classList.remove('flash-up','flash-down');
      void card.offsetWidth;
      card.classList.add(price>prev?'flash-up':'flash-down');
      setTimeout(()=>card.classList.remove('flash-up','flash-down'),900);
    }

    renderCard(token);
    await new Promise(r=>setTimeout(r,400));
  }

  setStatus('live',`Live · Updated ${new Date().toLocaleTimeString()}`);
}

// ═══════════════════════════════════════════════
// REFRESH HISTORY + RE-RENDER (timeframe switch)
// FIX 5: tfLabel() helper handles all 4 timeframes
// ═══════════════════════════════════════════════
async function switchTimeframe(tf) {
  activeTf = tf;
  setStatus('live','Loading history…');
  await loadAllHistory();
  deriveXrpUsdFromHistory(); // refresh rate from new window's data
  TOKENS.forEach(t => renderCard(t));
  setStatus('live',`Live · TF: ${tfLabel(tf)} · ${activeCur.toUpperCase()}`);
}

// ═══════════════════════════════════════════════
// CURRENCY SWITCH — instant re-render, no network
// ═══════════════════════════════════════════════
function switchCurrency(cur) {
  activeCur = cur;
  TOKENS.forEach(t => renderCard(t));
}

// ═══════════════════════════════════════════════
// COUNTDOWN BAR (5 min)
// ═══════════════════════════════════════════════
function startCountdown() {
  const fill = document.getElementById('bar');
  const ctr  = document.getElementById('countdown');
  let elapsed=0;
  if (cdInt) clearInterval(cdInt);
  fill.style.width='0%';
  cdInt = setInterval(()=>{
    elapsed+=1000;
    fill.style.width=Math.min((elapsed/TICK)*100,100)+'%';
    const rem=Math.max(0,Math.ceil((TICK-elapsed)/1000));
    ctr.textContent=rem>=60?Math.ceil(rem/60)+'m':rem+'s';
    if(elapsed>=TICK)elapsed=0;
  },1000);
}

// ═══════════════════════════════════════════════
// CONTROL BUTTONS
// ═══════════════════════════════════════════════
document.getElementById('tf-group').addEventListener('click', async e => {
  const btn = e.target.closest('.ctrl-btn');
  if (!btn) return;
  document.querySelectorAll('#tf-group .ctrl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  await switchTimeframe(+btn.dataset.tf);
});

document.getElementById('cur-group').addEventListener('click', e => {
  const btn = e.target.closest('.ctrl-btn');
  if (!btn) return;
  document.querySelectorAll('#cur-group .ctrl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  switchCurrency(btn.dataset.cur);
});

// ═══════════════════════════════════════════════
// INIT
// FIX 1: renders history data immediately — before live prices arrive
// FIX 2: removed refreshXrpUsd(); rate derived from history instead
// ═══════════════════════════════════════════════
async function init() {
  buildCards();
  setStatus('','Connecting…');

  // Load Supabase history and connect to XRPL simultaneously
  await Promise.all([
    loadAllHistory(),
    (async () => {
      try {
        client = new xrpl.Client(WS);
        await client.connect();
      } catch(e) {
        // XRPL failure is non-fatal — history data still renders
        setStatus('err','XRPL offline · showing history');
      }
    })(),
  ]);

  // FIX 2: derive XRP/USD rate from the history we just loaded
  deriveXrpUsdFromHistory();

  // FIX 1: render immediately with history — live overlay follows in fetchAll()
  TOKENS.forEach(t => renderCard(t));
  setStatus('live','History loaded · Fetching live prices…');

  await fetchAll();

  setInterval(async ()=>{
    await loadAllHistory();
    await fetchAll();
  }, TICK);

  startCountdown();
}

window.addEventListener('beforeunload',()=>{
  if(client?.isConnected()) client.disconnect().catch(()=>{});
});

// ═══════════════════════════════════════════════
// THEME TOGGLE — matches xstik.art main site
// ═══════════════════════════════════════════════
function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  try { localStorage.setItem('xstik-theme', isLight ? 'light' : 'dark'); } catch(e) {}
  document.getElementById('theme-toggle').textContent = isLight ? '\u263E' : '\u263C';
  // Redraw charts with correct grid colour
  TOKENS.forEach(t => {
    const vals = getDisplayValues(t.symbol);
    drawChart(t.symbol, vals);
  });
}
(function() {
  try {
    if (localStorage.getItem('xstik-theme') === 'light') {
      document.body.classList.add('light');
      document.getElementById('theme-toggle').textContent = '\u263E';
    }
  } catch(e) {}
})();
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

init();
</script>
